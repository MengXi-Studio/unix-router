name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支 / PR 只保留最新一次运行，取消进行中的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Sync / Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # dist/plugin 是 gitignored 构建产物，镜像校验前需先生成
      - name: Build core plugin
        run: pnpm --dir packages/core build

      - name: Check uni_modules mirror sync
        run: pnpm sync:uni-modules:check

      - name: Build docs
        run: pnpm build:docs
